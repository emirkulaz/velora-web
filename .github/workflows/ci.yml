name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
        env:
          VITE_API_URL: https://velora-production-01a9.up.railway.app
      - run: npm run bundle:check
